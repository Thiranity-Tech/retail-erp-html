  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:${t.subtle};border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:${t.muted}}
  body{background:${t.bg};color:${t.text};font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  input,select,textarea{
    font-family:'Inter',sans-serif;font-size:13px;
    background:${t.inputBg};color:${t.text};
    border:1.5px solid ${t.border};border-radius:8px;
    padding:8px 12px;outline:none;
    transition:border-color .15s,box-shadow .15s;
    width:100%
  }
  input:focus,select:focus,textarea:focus{
    border-color:${t.accent};
    box-shadow:0 0 0 3px ${t.accentDim}
  }
  input::placeholder{color:${t.muted};opacity:.7}
  select option{background:${t.card};color:${t.text}}
  button{font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  table{border-collapse:collapse;width:100%}
  th{
    text-align:left;font-size:11px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    color:${t.muted};padding:10px 14px;
    border-bottom:1px solid ${t.border};white-space:nowrap;
    background:${t.surface}
  }
  td{padding:10px 14px;border-bottom:1px solid ${t.border};font-size:13px;color:${t.text}}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .1s}
  tbody tr:hover td{background:${t.accentDim}}
  .mono{font-family:'JetBrains Mono',monospace}
  /* Spreadsheet grid */
  .sg-outer{border:1.5px solid ${t.accent};border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 4px 20px rgba(99,102,241,.12)}
  .sg-scroll{overflow-x:auto;overflow-y:auto;max-height:420px}
  .sg-table{border-collapse:collapse;width:100%;min-width:1100px}
  .sg-th{background:#e0e7ff;color:#3730a3;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 8px;border-right:1px solid #c7d2fe;border-bottom:2px solid #6366f1;white-space:nowrap;text-align:left;position:sticky;top:0;z-index:2}
  .sg-th-num{text-align:right}
  .sg-rn{background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:600;padding:0 8px;border-right:1px solid #c7d2fe;border-bottom:1px solid #e0e7ff;text-align:center;width:32px;user-select:none;vertical-align:middle}
  .sg-cell{border-right:1px solid #e0e7ff;border-bottom:1px solid #e0e7ff;padding:0;background:#fff;vertical-align:middle}
  .sg-cell-num{border-right:1px solid #e0e7ff;border-bottom:1px solid #e0e7ff;padding:0;background:#fff;vertical-align:middle}
  .sg-input{border:none;background:transparent;color:#0f172a;padding:4px 8px;width:100%;height:28px;font-size:12.5px;font-family:'Inter',sans-serif;outline:none;display:block}
  .sg-input-num{border:none;background:transparent;color:#1e3a8a;padding:4px 8px;width:100%;height:28px;font-size:12.5px;font-family:'JetBrains Mono',monospace;text-align:right;outline:none;display:block}
